services:
  app:
    build: .
    env_file: .env
    environment:
      DEMO_MODE: "${DEMO_MODE:-0}"
      PORT: "4173"
      HOST: "0.0.0.0"
    restart: unless-stopped
    volumes:
      - ./content.json:/app/content.json:ro
      - app-data:/app/data
  proxy:
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
volumes:
  app-data:
  caddy-data:
